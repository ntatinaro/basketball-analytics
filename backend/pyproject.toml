[project]
name = "hoops"
version = "0.1.0"
description = "Basketball prediction and analytics engine for the NBA and NCAA Division I men's basketball"
requires-python = ">=3.13"
dependencies = [
    "apscheduler>=3.10,<4",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "psycopg[binary]>=3.2",
    "scipy>=1.18.1",
]

[project.scripts]
hoops = "hoops.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hoops"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs a Postgres database at HOOPS_TEST_DATABASE_URL"]
