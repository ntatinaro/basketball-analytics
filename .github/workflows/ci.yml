name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: hoops
          POSTGRES_PASSWORD: hoops
          POSTGRES_DB: hoops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hoops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HOOPS_TEST_DATABASE_URL: postgresql://hoops:hoops@localhost:5432/hoops_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
